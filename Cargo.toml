[package]
name = "mylocate"
version = "0.2.0"
edition = "2021"
description = "macOS 上的即時檔案搜尋：打字即出結果、索引永遠是新的"
license = "MIT"
repository = "https://github.com/iamjlintw/mylocate"
readme = "README.md"
keywords = ["search", "filesystem", "macos", "fsevents", "locate"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "ml"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# SIMD 字串搜尋：純量逐 byte 比對是搜尋延遲的主要成本
memchr = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
